<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <img src="images/lock.svg" class="logo-image" />
    <h3 id="pluginName">Password Paster</h3>
    <p id="usageHint">
      Select the password field in browser then paste the password here and
      click on Paste button
    </p>
    <form id="passwordForm">
      <div class="password-input-wrapper">
        <input
          type="password"
          id="passwordInput"
          placeholder="Paste password here"
        />
        <button
          type="button"
          class="visibility-toggle"
          id="visibilityToggle"
          title="Show password"
          aria-label="Show password"
        >
          <img
            src="images/eye.svg"
            alt=""
            class="visibility-toggle-icon"
            id="visibilityToggleIcon"
          />
        </button>
      </div>
      <button id="submitBtn" type="submit">Paste</button>
    </form>
    <div id="messageBox" class="message-box"></div>

    <script
      type="application/javascript"
      src="../utils/browser-polyfill.min.js"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
